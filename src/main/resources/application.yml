server:
  port: 8001

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/end_of_term_revision?useSSL=false&serverTimezone=UTC&characterEncoding=utf8&allowPublicKeyRetrieval=true
    username: root
    password: 123456  # ⚠️ 请修改为你的实际 MySQL root 密码
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  jackson:
    serialization:
      WRITE_DATES_AS_TIMESTAMPS: false
    property-naming-strategy: SNAKE_CASE

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

logging:
  level:
    root: info
    org.springframework.web: info
    org.hibernate.SQL: debug

cors:
  allowed-origins:
    - "http://localhost:3000"

jwt:
  secret: "replace-this-with-a-strong-secret-key"
  expiration-ms: 604800000   # 7 天

app:
  upload-dir: uploads
  # 可选：首次启动时若该用户名不存在，则自动创建为管理员
  bootstrap-admin:
    username: ""
    password: ""


